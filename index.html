<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>「自分で守る」実行チェック＋漏えい通知の台帳</title>
<style>
  :root { --fg:#1a1a1a; --muted:#666; --line:#e2e2e2; --ok:#0a7d3c; --warn:#b45309; --red:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Hiragino Sans",sans-serif; color:var(--fg);
         line-height:1.7; background:#fafafa; }
  main { max-width:700px; margin:0 auto; padding:28px 18px 72px; }
  h1 { font-size:22px; line-height:1.45; margin:0 0 6px; }
  h2.sec { font-size:17px; margin:34px 0 10px; padding-top:18px; border-top:2px solid var(--fg); }
  .lead { color:var(--muted); font-size:14px; margin:0 0 20px; }
  .quote { border-left:3px solid var(--line); padding:2px 0 2px 12px; color:var(--muted);
           font-size:13.5px; margin:0 0 20px; }
  .bar { position:sticky; top:0; z-index:2; background:#fafafa; padding:10px 0; border-bottom:1px solid var(--line);
         display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:16px; }
  .bar b { font-size:15px; }
  .bar .right { display:flex; gap:10px; align-items:baseline; }
  .bar button.lang { font:inherit; font-size:12.5px; background:#fff; color:var(--fg);
                     border:1px solid var(--line); border-radius:6px; padding:3px 10px; cursor:pointer; }
  .item { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:0 0 10px; }
  .item label { display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
  .item input { margin:5px 0 0; width:18px; height:18px; flex:none; }
  .item h3 { font-size:15.5px; margin:0 0 4px; }
  .item p { margin:0; font-size:13.5px; color:var(--muted); }
  .item .src { font-size:12.5px; margin-top:6px; }
  .item:has(input:checked) { border-color:var(--ok); background:#f4fbf6; }
  .item:has(input:checked) h3 { color:var(--ok); }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:0 0 12px; }
  .card h3 { font-size:15.5px; margin:0 0 2px; }
  .meta { font-size:12.5px; color:var(--muted); }
  .task { display:flex; gap:8px; align-items:flex-start; font-size:13.5px; padding:6px 0; border-top:1px dashed var(--line); }
  .task input { margin:4px 0 0; width:16px; height:16px; flex:none; }
  .due { font-size:12px; border-radius:4px; padding:1px 6px; flex:none; margin-left:auto; white-space:nowrap; }
  .due.today { background:#fee2e2; color:var(--red); }
  .due.week  { background:#fef3c7; color:var(--warn); }
  .due.later { background:#eef2ff; color:#3730a3; }
  .done { color:var(--muted); text-decoration:line-through; }
  label.fld { display:block; font-size:12.5px; color:var(--muted); margin:10px 0 4px; }
  input[type=text], input[type=date] { width:100%; padding:8px 10px; font-size:14px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .checks { display:grid; grid-template-columns:1fr 1fr; gap:2px 12px; margin-top:6px; }
  .checks label { font-size:13.5px; display:flex; gap:7px; align-items:center; }
  .checks input { width:16px; height:16px; flex:none; }
  button.act { font:inherit; font-size:13.5px; padding:9px 14px; border-radius:8px; border:1px solid var(--fg);
               background:var(--fg); color:#fff; cursor:pointer; margin:14px 8px 0 0; }
  button.act.ghost { background:#fff; color:var(--fg); }
  .note { font-size:12.5px; color:var(--muted); margin-top:22px; border-top:1px solid var(--line); padding-top:14px; }
  a { color:#0b57d0; }
  .empty { font-size:13.5px; color:var(--muted); }
  #copyarea { width:100%; height:120px; margin-top:8px; font-size:12.5px; display:none; }
  .reset { background:none; border:none; color:var(--muted); font-size:12.5px; text-decoration:underline; cursor:pointer; padding:0; }
  @media (max-width:480px){ .checks { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <h1 id="t-h1"></h1>
  <p class="lead" id="t-lead"></p>
  <blockquote class="quote" id="t-quote"></blockquote>

  <div class="bar">
    <span><b id="count">0</b> <span id="t-doneof"></span></span>
    <span class="right">
      <button class="lang" id="langBtn" type="button"></button>
      <button class="reset" id="reset" type="button"></button>
    </span>
  </div>
  <div id="items"></div>

  <h2 class="sec" id="t-h2-ledger"></h2>
  <p class="lead" id="t-ledger-lead"></p>

  <div class="card">
    <label class="fld" for="src" id="l-src"></label>
    <input type="text" id="src" placeholder="例: 通知元のサービス名">
    <label class="fld" for="notified" id="l-notified"></label>
    <input type="date" id="notified">
    <label class="fld" id="l-kinds"></label>
    <div class="checks" id="kinds"></div>
    <button class="act" id="add" type="button"></button>
  </div>

  <div id="cases"></div>
  <div id="ledgerTools" style="display:none">
    <button class="act ghost" id="copy" type="button"></button>
    <button class="act ghost" id="clear" type="button"></button>
    <textarea id="copyarea" readonly></textarea>
  </div>

  <p class="note" id="t-note"></p>
</main>

<script>
/* ---------- language state ---------- */
/* gitleaks:allow - localStorage key name, not a credential */
const LKEY_LANG = "jibun-lang-v1";
let LANG = "ja";
try { const v = localStorage.getItem(LKEY_LANG); if (v === "ja" || v === "en") LANG = v; } catch {}
const saveLang = () => { try { localStorage.setItem(LKEY_LANG, LANG); } catch {} };
const tx = o => (o && typeof o === "object" && !(o instanceof Date)) ? o[LANG] : o;

const T = {
  title: { ja: "「自分で守る」実行チェック＋漏えい通知の台帳",
           en: "Leak-Response Checklist & Notification Ledger (Japan)" },
  h1: { ja: "「自分で守る」実行チェック",

          en: 'The government asked individuals to "protect your own information." This page turns that into steps you can actually do today — plus a <b>leak-notification ledger</b> that records each notice and turns it into dated next actions. <b>Everything runs on your device</b>; nothing you enter is sent anywhere.' },
  quote: { ja: '「自分の情報は自分で守るという意識を持って、被害防止に向けた取り組みに協力してほしい」<br>——古川俊治デジタル相（2026年10月6日 記者会見）。示された3つは<a href="https://www.npa.go.jp/bureau/cyber/countermeasures/basic.html" target="_blank" rel="noopener">パスワードの使い回しをやめる／多要素認証を使う／不審なメール・SNSに注意する</a>。<br>「企業が守れないのに個人で守れるのか」という批判も出ています。<b>漏らすのは企業側です。</b>個人にできるのは「漏れても広がらない状態」を先に作ることだけ。<b>1つやれば十分</b>です。',
           en: '"Be aware that you must protect your own information, and cooperate in preventing damage." — Shunji Furukawa, Minister for Digital (press conference, Oct 6, 2026). The three measures: <a href="https://www.npa.go.jp/bureau/cyber/countermeasures/basic.html" target="_blank" rel="noopener">stop reusing passwords / use multi-factor authentication / watch out for suspicious emails and social media</a> (Japanese page).<br>"Companies leak — how can individuals protect anything?" people replied. Fair. <b>The leaking side is the companies.</b> What an individual can do is only this: <b>build, in advance, a state where a leak does not spread.</b> Doing one thing is enough.' },
  doneof: { ja: "/ 5 実行済み", en: "/ 5 done" },

                en: 'When a notice arrives, record <b>the source, the date, and what leaked</b>. The page turns it into actions with deadlines, and keeps as many notices as you need (a second and third notice stack up alongside the first).' },
  lSrc: { ja: "通知元（企業名など・任意）", en: "Source (company/service name, optional)" },

  target: { ja: days => `（目安: 通知日+${days}日）`, en: days => `(target: notice date +${days}d)` },

  alertNone: { ja: "漏れた情報を1つ以上選んでください。通知が手元に無い場合は、上の「自分で守る」チェックを1つやれば十分です。",
               en: "Pick at least one leaked data type. If you have no notice at hand, one item from the checklist above is enough." },
  confirmClear: { ja: "台帳の記録を全部消します。よろしいですか？", en: "Delete all ledger records? This cannot be undone." },
  note: { ja: '<b>このページの限界（正直に書きます）</b><br>・防御や被害の防止を保証するものではありません。企業側の漏えいは個人では防げません。掲載する手順は公的機関の一般的な注意喚起で、個別の状況に対する法的・技術的な判断ではありません。<br>・入力・記録はお使いの端末（ブラウザ内）にのみ保存され、外部に送信されません。端末を変えると消えます。ブラウザのデータ削除でも消えます。<br>・公的資料（警察庁・個人情報保護委員会・国民生活センター等）と各サービス公式ページを根拠にしていますが、仕様変更で手順は古くなります。<br>・実際の被害は警察のサイバー相談窓口へ。契約・請求の消費者トラブルは消費者ホットライン188へ。',
          en: '<b>The limits of this page, stated honestly</b><br>· This page guarantees nothing: it cannot prevent breaches, and corporate breaches cannot be prevented by individuals. The steps are general guidance from public authorities — not legal or technical advice for your specific situation.<br>· Your input and records stay on your device (in the browser) and are never sent anywhere. They disappear if you change devices or clear your browser data.<br>· Steps are based on public materials (NPA, Personal Information Protection Commission, National Consumer Affairs Center) and official service pages; procedures age as those pages change.<br>· For actual damage, contact your local police cybercrime consultation desk. For consumer disputes, call Japan\'s consumer hotline 188.' },
  langBtn: { ja: "English", en: "日本語" },
};

/* ---------- 実行チェック（政府の呼びかけ＋AI＋通知対応） ---------- */
const ITEMS = [
  { id:"pw", title:{ ja:"同じパスワードを使っているサービスを1つ減らす",
                     en:"Cut down ONE service that shares the same password" },
    body:{ ja:"使い回しは「1社漏れたら全部漏れる」構造。全部変えなくていい。まず銀行・メール・SNSのどれか1つを、他と違う長いパスワードに。連鎖が1本切れます。",
           en:"Reuse means one breach opens every account. You don't have to change everything: pick one (bank, email or social) and give it a long, unique password. One chain cut." },
    src:{ ja:"警察庁 基本的なセキュリティ対策", en:"NPA: Basic security measures (Japanese)",
          url:"https://www.npa.go.jp/bureau/cyber/countermeasures/basic.html" } },
  { id:"mfa", title:{ ja:"いま使っているメールとSNSで多要素認証をオンにする",

    body:{ ja:"盗まれたID・パスワードで侵入されるのが国内被害の主流。認証アプリ（またはパスキー）で、まずメール1つだけ有効に。SMS認証より認証アプリのほうが強いとされています。",
           en:"Stolen IDs and passwords are the main way people break in. Use an authenticator app (or passkey) — start with just your email. App codes are considered stronger than SMS." },
    src:{ ja:"警察庁 不正アクセス対策", en:"NPA: Unauthorized access countermeasures (Japanese)",
          url:"https://www.npa.go.jp/bureau/cyber/countermeasures/unauthorized-access.html" } },
  { id:"phish", title:{ ja:"「リンクを踏まない」を1つ決めておく",
                        en:"Decide one rule: don't tap links" },
    body:{ ja:"漏えい後に増えるのは宅配・銀行・カード・漏えい元企業を装ったSMS/メール。「料金・確認・再設定・補償」で急がせる文面は開かない。公式アプリか、自分で検索して開いたページだけを使う。",
           en:"After a leak, fake delivery/bank/card messages multiply. Never open anything that rushes you with fees, verification, resets or compensation. Use the official app, or find the site by searching yourself." },
    src:{ ja:"フィッシング対策協議会", en:"Anti-Phishing Council of Japan",
          url:"https://www.antiphishing.jp/" } },
  { id:"ai", title:{ ja:"AI（ChatGPT・Claude・Copilot）に学習させない設定を入れる",
                     en:"Turn off AI training settings (ChatGPT, Claude, Copilot...)" },
    body:{ ja:"仕事でも私用でも使い始めた人ほど抜けるところ。各サービスは学習に使わせない設定を持っています（無料版でも可能なものが多い）。あわせて「貼らない情報」を決める：氏名＋住所のセット、顧客・取引先の情報、社内文書、契約書、認証情報、本人確認書類の画像。",
           en:"The step newcomers skip most. Each service has a setting that keeps your input out of model training (often available on free plans). Also decide what you never paste: name+address pairs, client data, internal documents, contracts, credentials, images of ID documents." },
    src:{ ja:"個人情報保護委員会 生成AIサービスの利用に関する注意喚起", en:"PPC: Alert on generative AI services (Japanese)",
          url:"https://www.ppc.go.jp/files/pdf/230602_alert_generative_AI_service.pdf" } },
  { id:"notice", title:{ ja:"漏えいのお知らせが来たら「種類」で動きを決める",
                         en:"When a leak notice arrives, act by data type" },
    body:{ ja:"パスワード＝その日のうちに変更（使い回し先も／数時間で試されます）／カード＝明細とカード会社、補償は60日ルール／口座・暗証番号＝すぐ連絡／メール・住所・電話だけ＝警戒モードで十分（変更は不要）／免許証画像＝信用情報機関の本人申告制度で名義の悪用防止を登録できる場合があります。詳しくは下の台帳へ。",
           en:"Password = change that day (reused ones too — they get tried within hours) / Card = statements + issuer; compensation windows are short (about 60 days) / Bank account & PIN = contact immediately / Email, address, phone only = heightened alert is enough (no need to change) / License images = you may be able to file a name-misuse alert with credit bureaus. Details in the ledger below." },
    src:{ ja:"個人情報保護委員会 漏えい等の対応", en:"PPC: Handling leak notifications (Japanese)",

const KIND_OPTIONS = [
  { id:"pw",      label:{ ja:"パスワード", en:"Password" } },
  { id:"email",   label:{ ja:"メールアドレス", en:"Email address" } },
  { id:"addr",    label:{ ja:"氏名・住所・電話番号", en:"Name, address, phone number" } },

                           en:"Compensation depends on how fast you report (about 60 days) — call early about anything odd" } },
  ],
  bank: [
    { k:"bk0", days:0, t:{ ja:"ネットバンキングのパスワードを変更し、身に覚えのない出金がないか確認する",

    { k:"bk1", days:0, t:{ ja:"銀行を名乗る電話・SMSへの警戒を最大にする（ボイスフィッシングの主材料になる）",

    { k:"bk2", days:7, t:{ ja:"必要なら取引店に連絡して、口座の監視強化を相談する",

  ],

    { k:"lc0", days:14, src:{ ja:"JICC 不正利用防止の届け出", en:"JICC improper-use alert (Japanese)" },
      t:{ ja:"信用情報機関の「本人申告制度」で名義の悪用防止を登録できるか確認する（JICC・全国銀行個人信用情報センター等）",
          en:"Check whether you can file a name-misuse prevention alert (本人申告) with credit bureaus (JICC, FLC and others)" } },
    { k:"lc1", days:30, t:{ ja:"CIC・JICC・全国銀行個人信用情報センターの開示で、身に覚えのない契約が登録されていないか確認する",
                            en:"Request disclosure from CIC/JICC/FLC and check for contracts you never made" } },
    { k:"lc2", days:14, t:{ ja:"免許証を再交付しても番号の上11桁は変わらない点に注意（再交付＝解決ではありません）",
                            en:"Note: reissuing a license does NOT change its first 11 digits — reissue alone is not a fix" } },
    { k:"lc3", days:30, t:{ ja:"クレジット・ローン・携帯の契約は、本人確認が厳しい手続きに寄せる（マイナンバーカード等）",
                            en:"Keep identity checks strict for credit, loans and phone contracts (e.g., My Number Card)" } },
  ]
};
const STEPS_BY_KEY = {};
for (const list of Object.values(STEPS)) for (const s of list) STEPS_BY_KEY[s.k] = s;
const KIND_LABEL = Object.fromEntries(KIND_OPTIONS.map(k => [k.id, k.label]));

/* ---------- 実行チェックの状態 ---------- */
/* gitleaks:allow - localStorage key name, not a credential */
const KEY = "jibun-mamoru-v1"; // gitleaks:allow - localStorage key name, not a credential
const state = (() => {
  try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); return Object.fromEntries(ITEMS.map(i => [i.id, s[i.id] === true])); }
  catch { return Object.fromEntries(ITEMS.map(i => [i.id, false])); }
})();
const wrap = document.getElementById("items"), countEl = document.getElementById("count");

function render() {
  wrap.innerHTML = "";
  for (const it of ITEMS) {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<label>
      <input type="checkbox" data-id="${it.id}" ${state[it.id] ? "checked" : ""}>
      <span><h3>${tx(it.title)}</h3><p>${tx(it.body)}</p>
      <span class="src"><a href="${it.src.url}" target="_blank" rel="noopener">${tx(it.src)}</a></span></span></label>`;
    wrap.appendChild(div);
  }
  wrap.querySelectorAll("input[type=checkbox]").forEach(cb => cb.addEventListener("change", () => {
    state[cb.dataset.id] = cb.checked;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
    updateCount();
  }));
  updateCount();
}
function updateCount() { countEl.textContent = ITEMS.filter(i => state[i.id]).length; }
document.getElementById("reset").addEventListener("click", () => {
  for (const i of ITEMS) state[i.id] = false;
  try { localStorage.removeItem(KEY); } catch {}
  render();
});

/* ---------- 漏えい通知の台帳 ---------- */
const LKEY = "jibun-ledger-v1"; // gitleaks:allow - localStorage key name, not a credential
const load = () => { try { return JSON.parse(localStorage.getItem(LKEY) || "[]"); } catch { return []; } };
const save = d => { try { localStorage.setItem(LKEY, JSON.stringify(d)); } catch {} };
let cases = load();
/* migration: records created before step keys existed carry JA text only */
for (const c of cases) for (const s of (c.tasks || [])) {
  if (!s.k) { const m = Object.values(STEPS_BY_KEY).find(x => x.t.ja === s.t); if (m) s.k = m.k; }
}

const today = () => new Date(new Date().toDateString());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmt = d => `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
const daysLeft = d => Math.round((d - today()) / 86400000);
const CLASS = { 0:"today", 7:"week", 14:"week", 30:"later" };
const stepText = s => { const m = s.k && STEPS_BY_KEY[s.k]; return m ? tx(m.t) : s.t; };

function kindChecks() {
  document.getElementById("kinds").innerHTML = KIND_OPTIONS.map(k =>
    `<label><input type="checkbox" value="${k.id}"> ${tx(k.label)}</label>`).join("");
}

function stepsFor(kinds) {
  const out = [...STEPS.common];
  const seen = new Set(out.map(s => s.k));
  for (const k of kinds) for (const s of (STEPS[k] || [])) if (!seen.has(s.k)) { seen.add(s.k); out.push(s); }
  return out.sort((a, b) => a.days - b.days);
}

function renderCases() {
  const box = document.getElementById("cases");
  document.getElementById("ledgerTools").style.display = cases.length ? "" : "none";
  if (!cases.length) { box.innerHTML = `<p class="empty">${tx(T.empty)}</p>`; return; }
  box.innerHTML = "";
  for (const c of cases.slice().sort((a, b) => (a.notified < b.notified ? 1 : -1))) {
    const base = new Date(c.notified);
    const el = document.createElement("div");
    el.className = "card";
    const kinds = c.kinds.map(k => (KIND_LABEL[k] || {})[LANG] || k).join("・");
    let html = `<h3>${c.src ? c.src : tx(T.noSrc)}</h3>
      <div class="meta">${tx(T.notifDate)} ${fmt(base)}／${tx(T.types)}${kinds || tx(T.kindsNone)}</div>`;
    for (const [i, s] of c.tasks.entries()) {
      const due = addDays(base, s.days), left = daysLeft(due);
      const label = left < 0 ? tx(T.overdue)(fmt(due)) : left === 0 ? tx(T.todayDue) : tx(T.daysLeft)(left, fmt(due));
      html += `<div class="task">
        <input type="checkbox" data-c="${c.id}" data-i="${i}" ${s.done ? "checked" : ""}>
        <span class="${s.done ? "done" : ""}">${stepText(s)}</span>
        <span class="due ${CLASS[s.days] || "later"}">${label}</span></div>`;
    }
    html += `<div class="meta" style="margin-top:8px">${tx(T.metaLine)}</div>
      <button class="act ghost" data-del="${c.id}" type="button">${tx(T.delCase)}</button>`;
    el.innerHTML = html;
    box.appendChild(el);
  }
  box.querySelectorAll("input[type=checkbox][data-c]").forEach(cb => cb.addEventListener("change", () => {
    const c = cases.find(x => x.id === cb.dataset.c), t = c.tasks[+cb.dataset.i];
    t.done = cb.checked; t.doneAt = cb.checked ? new Date().toISOString().slice(0, 10) : null;
    save(cases); renderCases();
  }));
  box.querySelectorAll("button[data-del]").forEach(b => b.addEventListener("click", () => {
    cases = cases.filter(x => x.id !== b.dataset.del); save(cases); renderCases();
  }));
}

function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = tx(T.title);
  document.getElementById("t-h1").textContent = tx(T.h1);
  document.getElementById("t-lead").innerHTML = tx(T.lead);
  document.getElementById("t-quote").innerHTML = tx(T.quote);
  document.getElementById("t-doneof").textContent = tx(T.doneof);
  document.getElementById("reset").textContent = tx(T.reset);
  document.getElementById("t-h2-ledger").textContent = tx(T.h2ledger);
  document.getElementById("t-ledger-lead").innerHTML = tx(T.ledgerLead);
  document.getElementById("l-src").textContent = tx(T.lSrc);
  document.getElementById("src").placeholder = tx(T.srcPh);
  document.getElementById("l-notified").textContent = tx(T.lNotified);
  document.getElementById("l-kinds").textContent = tx(T.lKinds);
  document.getElementById("add").textContent = tx(T.add);
  document.getElementById("copy").textContent = tx(T.copyBtn);
  document.getElementById("clear").textContent = tx(T.clearBtn);
  document.getElementById("t-note").innerHTML = tx(T.note);
  document.getElementById("langBtn").textContent = tx(T.langBtn);
}

document.getElementById("add").addEventListener("click", () => {
  const kinds = [...document.querySelectorAll("#kinds input:checked")].map(i => i.value);
  if (!kinds.length) { alert(tx(T.alertNone)); return; }
  const nd = document.getElementById("notified").value;
  const notified = nd ? new Date(nd) : today();
  cases.push({
    id: String(Date.now()),
    src: document.getElementById("src").value.trim(),
    notified: notified.toISOString().slice(0, 10),
    kinds,
    tasks: stepsFor(kinds).map(s => ({ k:s.k, t:s.t.ja, days:s.days, src: s.src ? tx(s.src) : null, done:false, doneAt:null }))
  });
  save(cases);
  document.getElementById("src").value = "";
  document.querySelectorAll("#kinds input").forEach(i => i.checked = false);
  renderCases();
});

document.getElementById("copy").addEventListener("click", () => {
  const lines = [tx(T.copyHead)];
  for (const c of cases) {
    const kinds = c.kinds.map(k => (KIND_LABEL[k] || {})[LANG] || k).join("・");
    lines.push("", `${c.src || tx(T.noSrc)} / ${tx(T.notifDate)} ${fmt(new Date(c.notified))} / ${tx(T.types)}${kinds}`);
    for (const s of c.tasks) lines.push(`  [${s.done ? tx(T.doneMark)(s.doneAt || "") : tx(T.pendingMark)}] ${stepText(s)} ${tx(T.target)(s.days)}`);
  }
  lines.push("", tx(T.copyFoot));
  const ta = document.getElementById("copyarea");
  ta.style.display = "block"; ta.value = lines.join("\n"); ta.select();
  try { document.execCommand("copy"); } catch {}
});

document.getElementById("clear").addEventListener("click", () => {
  if (!confirm(tx(T.confirmClear))) return;
  cases = []; save(cases); renderCases();
});

document.getElementById("langBtn").addEventListener("click", () => {
  LANG = LANG === "ja" ? "en" : "ja";
  saveLang();
  applyStatic(); kindChecks(); render(); renderCases();
});

/* ---------- 起動 ---------- */
applyStatic();
kindChecks();
render();
renderCases();
document.getElementById("notified").value = today().toISOString().slice(0, 10);
</script>
</body>
</html>
